
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OlympicLens | Olympic Quiz</title>
  <a href="index.html">← Back to Home</a>
  <style>
    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 25px;
      background: #1e293b;
      border-radius: 14px;
    }

    h1 {
      text-align: center;
      color: #38bdf8;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
    }

    #question {
      font-size: 21px;
      margin: 25px 0;
    }

    .option {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      text-align: left;
      background: #334155;
      color: white;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .option:hover:not(:disabled) {
      border-color: #38bdf8;
    }

    .option:disabled {
      cursor: default;
      opacity: 0.9;
    }

    .correct {
      background: #166534;
    }

    .wrong {
      background: #991b1b;
    }

    .main-button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    #feedback {
      min-height: 24px;
      margin-top: 15px;
      font-weight: bold;
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      color: #cbd5e1;
    }

    a {
      color: #38bdf8;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🏅 Olympic Quiz</h1>
    <p class="subtitle">Test your Olympic knowledge!</p>

    <div class="top">
      <span id="progress">Question 1 of 5</span>
      <span id="score">Score: 0</span>
    </div>

    <div id="quiz">
      <h2 id="question"></h2>
      <div id="options"></div>
      <p id="feedback" aria-live="polite"></p>
      <button id="nextButton" class="main-button hidden">Next Question</button>
    </div>

    <div id="result" class="hidden">
      <h2>Quiz Completed! 🎉</h2>
      <p id="finalScore"></p>
      <button id="restartButton" class="main-button">Play Again</button>
    </div>

    <p><a href="index.html">← Back to OlympicLens Dashboard</a></p>
  </div>

  <script>
    const questions = [
      {
        question: "1. In which year were the first modern Olympic Games held?",
        options: ["1896", "1900", "1920", "1980"],
        answer: 0
      },
      {
        question: "2. Which city hosted the 2024 Summer Olympics?",
        options: ["Tokyo", "Paris", "London", "Sydney"],
        answer: 1
      },
      {
        question: "3. How often are the Summer Olympics normally held?",
        options: ["Every 2 years", "Every 3 years", "Every 4 years", "Every 5 years"],
        answer: 2
      },
      {
        question: "4. What do the five Olympic rings represent?",
        options: [
          "Five sports",
          "Five continents traditionally represented by the Olympic symbol",
          "Five Olympic medals",
          "Five host cities"
        ],
        answer: 1
      },
      {
        question: "5. Which medal is awarded for first place?",
        options: ["Silver", "Bronze", "Copper", "Gold"],
        answer: 3
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const feedbackEl = document.getElementById("feedback");
    const nextButton = document.getElementById("nextButton");

    function showQuestion() {
      answered = false;
      const q = questions[currentQuestion];

      document.getElementById("progress").textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;

      document.getElementById("score").textContent = `Score: ${score}`;
      questionEl.textContent = q.question;
      optionsEl.innerHTML = "";
      feedbackEl.textContent = "";
      nextButton.classList.add("hidden");

      q.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.className = "option";
        button.textContent = option;
        button.addEventListener("click", () => selectAnswer(index, button));
        optionsEl.appendChild(button);
      });
    }

    function selectAnswer(index, selectedButton) {
      if (answered) return;
      answered = true;

      const correctIndex = questions[currentQuestion].answer;
      const buttons = optionsEl.querySelectorAll("button");

      buttons.forEach(button => button.disabled = true);
      buttons[correctIndex].classList.add("correct");

      if (index === correctIndex) {
        score++;
        feedbackEl.textContent = "Correct! 🎉";
      } else {
        selectedButton.classList.add("wrong");
        feedbackEl.textContent =
          "Not quite! The correct answer is " +
          questions[currentQuestion].options[correctIndex] + ".";
      }

      document.getElementById("score").textContent = `Score: ${score}`;
      nextButton.textContent =
        currentQuestion === questions.length - 1
          ? "See My Result"
          : "Next Question";

      nextButton.classList.remove("hidden");
    }

    nextButton.addEventListener("click", () => {
      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        document.getElementById("quiz").classList.add("hidden");
        document.getElementById("result").classList.remove("hidden");
        document.getElementById("finalScore").textContent =
          `You scored ${score} out of ${questions.length}!`;
      }
    });

    document.getElementById("restartButton").addEventListener("click", () => {
      currentQuestion = 0;
      score = 0;
      document.getElementById("quiz").classList.remove("hidden");
      document.getElementById("result").classList.add("hidden");
      showQuestion();
    });

    showQuestion();
  </script>
</body>
</html>
